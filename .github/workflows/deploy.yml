name: Deploy SanWoot a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Construir
        working-directory: app
        env:
          # Candado liviano del lado del cliente (ver src/state/AccessGate.tsx).
          # Se configura como secreto del repo: Settings > Secrets and variables
          # > Actions > VITE_ACCESS_CODE. Sin este secreto, la app queda sin candado.
          VITE_ACCESS_CODE: ${{ secrets.VITE_ACCESS_CODE }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
